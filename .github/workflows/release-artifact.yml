name: Release macOS artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  build:
    # macos-26 provides Swift 6.2+ required by this package.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build signed app and distributable ZIP
        run: ./Scripts/build-release.sh
      - name: Verify release metadata
        run: |
          plutil -lint dist/Terminal.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Terminal.app/Contents/Info.plist)" = com.alessandroviola.terminal
          codesign --verify --deep --strict dist/Terminal.app
          unzip -Z1 dist/Terminal-v*-macOS.zip | grep -q '^Terminal.app/Contents/MacOS/Terminal$'
      - name: Upload distributable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terminal-macOS
          path: dist/Terminal-v*-macOS.zip
          if-no-files-found: error
      - name: Publish GitHub Release for matching version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$TAG" = "v$VERSION"
          gh release create "$TAG" dist/Terminal-v*-macOS.zip --generate-notes
